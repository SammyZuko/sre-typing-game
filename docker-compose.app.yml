version: "3.9"

services:
  app:
    build: ./app
    container_name: typing-game-app
    restart: unless-stopped
    ports:
      - "5000:5000"   # kept for Prometheus (Instance 2) to scrape /metrics directly
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: typinggame
      DB_USER: typinggame
      DB_PASSWORD: ${DB_PASSWORD:-typinggame}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: typing-game-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: typinggame
      POSTGRES_USER: typinggame
      POSTGRES_PASSWORD: ${DB_PASSWORD:-typinggame}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port — only the app container talks to it, over the compose network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"   # host metrics — Instance 2's Prometheus scrapes this too

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.app:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
