groups:
  - name: typing-game-alerts
    rules:
      - alert: AppDown
        expr: up{job="typing-game-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Typing game app is down"
          description: "Prometheus has not been able to scrape the app for 1 minute."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency is above 1s"
          description: "P95 request latency has exceeded 1 second for 5 minutes."
