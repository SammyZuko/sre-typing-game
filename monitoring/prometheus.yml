global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "typing-game-app"
    static_configs:
      - targets: ["172.31.23.253:5000"]

  - job_name: "node-exporter-app-host"
    static_configs:
      - targets: ["172.31.23.253:9100"]

  - job_name: "node-exporter-monitoring-host"
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
