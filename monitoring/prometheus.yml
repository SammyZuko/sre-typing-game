global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "typing-game-app"
    static_configs:
      # Replace with Instance 1's PRIVATE IP (not public) — Prometheus and the
      # app talk to each other inside the VPC.
      - targets: ["INSTANCE_1_PRIVATE_IP:5000"]

  - job_name: "node-exporter-app-host"
    static_configs:
      - targets: ["INSTANCE_1_PRIVATE_IP:9100"]

  - job_name: "node-exporter-monitoring-host"
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
