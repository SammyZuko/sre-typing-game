<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Speed Game</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap">
    <h1>Typing Speed Game</h1>
    <p class="sub">Type the prompt below as fast and accurately as you can.</p>

    <div id="prompt" class="prompt">Loading prompt...</div>
    <textarea id="input" rows="3" placeholder="Start typing here..." disabled></textarea>

    <div class="stats">
      <span>WPM: <b id="wpm">0</b></span>
      <span>Accuracy: <b id="accuracy">100</b>%</span>
      <span>Time: <b id="time">0</b>s</span>
    </div>

    <div class="controls">
      <input id="player_name" placeholder="Your name (optional)" maxlength="64">
      <button id="restart">New Prompt</button>
    </div>

    <p id="result" class="result"></p>

    <section>
      <h2>Leaderboard</h2>
      <ol id="leaderboard"></ol>
    </section>
  </main>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
